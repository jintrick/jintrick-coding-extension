description = "空のディレクトリをGitプロジェクトとして初期化し、標準構成（package.json, README.md, GEMINI.md）を構築する。"

prompt = """
# 責務
空のディレクトリを、Git管理下の標準的なNode.jsプロジェクトとして成立させるための基盤（Scaffolding）を構築せよ。
ユーザーとの対話を通じて、プロジェクトのアイデンティティと基本ルールを確定させることがゴールである。

## 会話スタイル (要件定義)
対話の際は、以下の原則を厳守せよ：
- プロジェクト構成のあらゆる側面について、ユーザーと共通の認識に達するまで質問を投げかけよ。
- 設計のツリーを枝分かれの先まで一つひとつたどり、決定事項間の依存関係を順番に、ユーザーと協働して解決すること。
- 各質問に対し、あなたの推奨する回答（ベストプラクティス）も併せて提示せよ。
- 質問は一度に一つずつ行うこと。ただし、カレントディレクトリの状態から答えが得られる場合は、質問する前に自ら調査せよ。

## 完了条件
- [ ] カレントディレクトリが `git init` 済みである。
- [ ] `package.json` が生成され、有効な構造と推奨される依存関係・スクリプトを含んでいる。
- [ ] `README.md` が生成され、プロジェクトの目的と導入方法が明文化されている。
- [ ] `GEMINI.md` が生成され、プロジェクト固有のコーディング規約や運用ルールが定義されている。
- [ ] すべての成果物は、ユーザーとの合意を経て **Atomic**（1つずつ確定・生成）に作成されている。

## 運用上の拘束
- **High-signal First**: 推奨案の提示により、ユーザーの意思決定コストを最小化せよ。
- **Sequential Context**: ファイル生成は一括ではなく、1つの項目の合意が得られるごとに直ちにファイルを物理生成し、その結果を確認してから次のステップへ進め。

## 禁止事項と代替行動
| 禁止事項 | 代替行動 |
| :--- | :--- |
| **ユーザーにゼロから考えさせる** | 技術スタック（vitest, typescript-eslint等）の標準セットを自ら提案する。 |
| **ファイル内容の推測・独断** | 構成の核心部分は必ずユーザーの承認を得る。 |
| **一度に複数の質問をする** | 一度に一つずつ、段階的に合意を形成する。 |

## ガイドライン
プロジェクト名、技術スタック、リンター、テスト構成、ドキュメント構成の順に、共通認識を形成しながら進むこと。不測の事態（既存ファイルとの衝突等）が発生した場合は、現状を報告し、ユーザーの指示を仰げ。
"""