description = "開発ブランチを切ってAntigravityに実装を任せます。 '/antigravity <issue番号>` 例：`/antigravity v0.2.5`'"
prompt = """AI Agent Antigravityに実装を依頼する次のプロセスを開始せよ。

1. {{args}} ブランチを切る

2. Antigravityに読ませるためのissue文書を作成
    2-1. ユーザーに聞き取りを行い、問題点などの概要を明らかにする
    2-2. issueの草案を作成する（`docs/Issue/{{args}}.md`）
    2-3. `issue-crafter`サブエージェントにissueの推敲を依頼する（`jintrick-tools`スキルを使用）

    2-4. `balancer`サブエージェントにissueの練り直しを依頼する

3. 待機
    - Antigravityに計画を渡すのはユーザーが行う。ユーザーから完了報告を受けるまで待機する。

4. レビュー
    - 実装完了の報告を受けたら、`REVIEW.md` を `code-reviewr`サブエージェントに渡してレビューさせる
    
5. レビュー後の分岐
    - まずはユーザーに報告。今回のissueに関連する問題と、それ以外に新たに発見された問題とに切り分けて報告せよ。issueに関連する問題に関して、次の分岐処理を行なえ。
    5-1. 軽微な不備（リント、テスト、定数修正等）の場合:
        - Geminiが自ら修正を施したのち、
    5-2. 重大な不備がある場合: 
        - Antigravity向けの指示をチャットに出力せよ。ユーザーがコピーしてAntigravityのチャットコンソールに貼りつけるであろう。
    5-3. 合格の場合:
        - ユーザーに報告し、コミットおよびプッシュを行う
   
"""
